name: optima
description: "A CRM App"

version: 1.0.15+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: 
    sdk: flutter
  
  # Common UI + Utils
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  uuid: ^4.3.3
  intl: 0.19.0  

  # Location & Permissions
  geolocator: ^14.0.1
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  permission_handler_html: ^0.1.0+1

  # UI / Visualization
  multi_dropdown: ^3.0.1
  multi_select_flutter: ^4.1.3
  flutter_async_autocomplete: ^0.1.1
  easy_stepper: ^0.8.3
  flutter_fancy_tree_view: ^1.4.1
  fl_chart: ^1.1.1
  percent_indicator: ^4.2.3
  animated_custom_dropdown: ^3.1.1
  pluto_grid: ^8.0.0

  # Pickers
  month_year_picker: ^0.5.0+1
  month_picker_dialog: ^6.5.0

  # Device info
  package_info_plus: ^9.0.0
  device_info_plus: ^12.1.0

  # File & Storage
  pdf: ^3.10.8
  excel: ^4.0.6
  flutter_downloader: ^1.11.6
  open_file: ^3.3.2
  path_provider: ^2.1.4
  syncfusion_flutter_xlsio: ^24.1.41
  file_picker: ^8.0.0

  # Speech / Web
  speech_to_text: ^7.3.0
  web: ^1.1.1
  universal_html: ^2.2.4
  url_launcher: ^6.3.2

dependency_overrides:
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
flutter:
  uses-material-design: true

  assets:
    - assets/images/Amaryllis/logo.png
    - assets/images/Amaryllis/ph_user-circle-thin.png
    - assets/images/Amaryllis/password-visibility.png
    - assets/images/Amaryllis/splashscreen.png
    - assets/images/Amaryllis/companyName.png
    - assets/images/Amaryllis/optima.png
    
    # - assets/images/Bapuji/logo.png
    # - assets/images/Bapuji/ph_user-circle-thin.png
    # - assets/images/Bapuji/password-visibility.png
    # - assets/images/Bapuji/splashscreen.png
    # - assets/images/Bapuji/companyName.png
    # - assets/images/Bapuji/optima.png

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto.ttf 
